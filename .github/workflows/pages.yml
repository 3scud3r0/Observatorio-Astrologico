name: Deploy Observatorio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test traditional calculation engine
        shell: bash
        run: |
          set -euo pipefail
          node --check .site-src/traditional-engine.js
          node .site-src/traditional-engine.test.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('.site-src/traditional-suite-v2.html').read_text('utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          if not scripts:
              raise SystemExit('No inline scripts were extracted; aborting JavaScript validation')
          Path('/tmp/traditional-suite-inline.js').write_text('\n'.join(scripts),'utf-8')
          PY
          node --check /tmp/traditional-suite-inline.js

      - name: Assemble and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/swiss/ephe

          cat .site-src/index/part-*.html > _site/index.html
          # Injeta ferramentas adicionais antes do fechamento do documento, preservando o fonte principal dividido.
          python - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          enhancement = Path('.site-src/pro-tools.html').read_text('utf-8') + Path('.site-src/pro-upgrade.html').read_text('utf-8') + Path('.site-src/traditional-suite-v2.html').read_text('utf-8') + Path('.site-src/atlas-layout.html').read_text('utf-8')
          text = page.read_text('utf-8')
          marker = '</body>'
          if marker not in text:
              raise SystemExit('Expected </body> marker was not found')
          # O documento contém o literal </body> em bibliotecas incorporadas; anexar evita alterar qualquer script existente.
          page.write_text(text + enhancement, 'utf-8')
          print(f'Assembled {page.stat().st_size} bytes including professional tools.')
          PY

          python .site-src/atlas-release.py
          cp .site-src/atlas-auth.json _site/atlas-auth.json
          cp .site-src/traditional-engine.js _site/traditional-engine.js

          cp .nojekyll _site/.nojekyll
          cp LICENSE _site/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md

          PKG="$(npm pack @swisseph/browser@1.3.1 --silent)"
          mkdir -p /tmp/swisseph-browser
          tar -xzf "$PKG" -C /tmp/swisseph-browser
          cp /tmp/swisseph-browser/package/dist/swisseph-browser.js _site/swiss/swisseph-browser.js
          cp /tmp/swisseph-browser/package/dist/swisseph.js _site/swiss/swisseph.js
          cp /tmp/swisseph-browser/package/dist/swisseph.wasm _site/swiss/swisseph.wasm

          SWISS_COMMIT='9083a12d59e98034fb2337061481ac8800c16e64'
          for f in sepl_18.se1 semo_18.se1 seas_18.se1; do
            curl --fail --location --retry 4               "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${f}"               -o "_site/swiss/ephe/${f}"
          done

          test "$(stat -c%s _site/swiss/swisseph.wasm)" -gt 100000
          test "$(stat -c%s _site/swiss/ephe/sepl_18.se1)" -gt 100000
          test "$(stat -c%s _site/swiss/ephe/semo_18.se1)" -gt 500000
          test "$(stat -c%s _site/swiss/ephe/seas_18.se1)" -gt 100000

          python - <<'PY'
          from pathlib import Path
          wasm = Path('_site/swiss/swisseph.wasm')
          magic = wasm.read_bytes()[:4]
          if magic != bytes([0, 97, 115, 109]):
              raise SystemExit(f'Invalid WASM magic: {magic!r}')
          html = Path('_site/index.html').read_text('utf-8')
          required = [
              './swiss/swisseph-browser.js',
              './swiss/ephe/sepl_18.se1',
              './swiss/ephe/semo_18.se1',
              './swiss/ephe/seas_18.se1',
              './traditional-engine.js',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f'Missing local runtime references in index.html: {missing}')
          if 'Técnicas tradicionais Pro' not in html:
              raise SystemExit('Traditional Pro suite was not assembled')
          print('Static site, Swiss Ephemeris assets and Traditional Pro suite validated.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
