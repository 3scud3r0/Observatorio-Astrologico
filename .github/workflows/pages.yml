name: Deploy Observatorio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned shell toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund

      - name: Test traditional calculation engine
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --check .site-src/traditional-engine.js
          node .site-src/traditional-engine.test.js
          node --check .site-src/atlas-resume.js
          node .site-src/atlas-resume.test.js
          node --check .site-src/research-core.js
          node --check .site-src/research-lab.js
          node --check .site-src/research-vault.js
          node --check .site-src/research-vault-ui.js
          node .site-src/research-vault.test.js
          node .site-src/research-core.test.js
          node --check .site-src/research-analysis.js
          node .site-src/research-analysis.test.js
          node --check .site-src/research-pdf.js
          node .site-src/research-pdf.test.js
          node --check .site-src/timeline-core.js
          node --check .site-src/timeline-ui.js
          node .site-src/timeline-core.test.js
          node --check .site-src/guided-study.js
          node --check .site-src/offline-client.js
          node --check .site-src/swiss-scan-ui.js
          node --input-type=module --check < .site-src/swiss-scan-worker.js
          node --check .site-src/service-worker.js
          python -m py_compile .site-src/asset-provenance.py .site-src/build-metrics.py
          python .site-src/ui-contracts.test.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('.site-src/traditional-suite-v2.html').read_text('utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          if not scripts:
              raise SystemExit('No inline scripts were extracted; aborting JavaScript validation')
          Path('/tmp/traditional-suite-inline.js').write_text('\n'.join(scripts),'utf-8')
          PY
          node --check /tmp/traditional-suite-inline.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('.site-src/atlas-experience.html').read_text('utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          if not scripts:
              raise SystemExit('Atlas inline JavaScript was not extracted')
          Path('/tmp/atlas-experience-inline.js').write_text('\n'.join(scripts),'utf-8')
          PY
          node --check /tmp/atlas-experience-inline.js

      - name: Validate Pro Studio inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path('.site-src/pro-upgrade.html').read_text('utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',source,re.I) if x.strip()]
          if not scripts:
              raise SystemExit('Pro Studio inline JavaScript was not extracted')
          Path('/tmp/pro-studio-inline.js').write_text('\n'.join(scripts),'utf-8')
          PY
          node --check /tmp/pro-studio-inline.js

      - name: Assemble and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/swiss/ephe

          cat .site-src/index/part-*.html > _site/app.html
          # Injeta ferramentas adicionais antes do fechamento do documento, preservando o fonte principal dividido.
          python - <<'PY'
          from pathlib import Path
          page = Path('_site/app.html')
          enhancement = Path('.site-src/pro-tools.html').read_text('utf-8') + Path('.site-src/pro-upgrade.html').read_text('utf-8') + Path('.site-src/traditional-suite-v2.html').read_text('utf-8') + Path('.site-src/atlas-layout.html').read_text('utf-8')
          text = page.read_text('utf-8')
          marker = '</body>'
          if marker not in text:
              raise SystemExit('Expected </body> marker was not found')
          # O documento contém o literal </body> em bibliotecas incorporadas; anexar evita alterar qualquer script existente.
          page.write_text(text + enhancement, 'utf-8')
          print(f'Assembled {page.stat().st_size} bytes including professional tools.')
          PY

          python .site-src/atlas-release.py _site/app.html
          cp .site-src/atlas-resume.js _site/atlas-resume.js
          # Append the opt-in laboratory without changing the legacy application.
          cat .site-src/research-lab.html >> _site/app.html
          cat .site-src/research-vault-ui.html >> _site/app.html
          cp .site-src/research-vault.js _site/research-vault.js
          cp .site-src/research-vault-ui.js _site/research-vault-ui.js
          cat .site-src/timeline.html >> _site/app.html
          cat .site-src/guided-study.html >> _site/app.html
          cat .site-src/offline.html >> _site/app.html
          cat .site-src/swiss-scan.html >> _site/app.html
          cp .site-src/swiss-scan-ui.js _site/swiss-scan-ui.js
          cp .site-src/swiss-scan-worker.js _site/swiss-scan-worker.js
          cp .site-src/offline-client.js _site/offline-client.js
          cp .site-src/service-worker.js _site/service-worker.js
          cp .site-src/manifest.webmanifest _site/manifest.webmanifest
          cp .site-src/app-icon.svg _site/app-icon.svg
          cp .site-src/guided-study.js _site/guided-study.js
          cp .site-src/timeline-core.js _site/timeline-core.js
          cp .site-src/timeline-ui.js _site/timeline-ui.js
          cp .site-src/research-core.js _site/research-core.js
          cp .site-src/research-lab.js _site/research-lab.js
          cp .site-src/research-analysis.js _site/research-analysis.js
          cp .site-src/research-pdf.js _site/research-pdf.js
          cp .site-src/atlas-auth.json _site/atlas-auth.json
          cp .site-src/traditional-engine.js _site/traditional-engine.js

          cp .nojekyll _site/.nojekyll
          cp LICENSE _site/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md

          PKG="$(npm pack @swisseph/browser@1.3.1 --silent)"
          mkdir -p /tmp/swisseph-browser
          tar -xzf "$PKG" -C /tmp/swisseph-browser
          cp /tmp/swisseph-browser/package/dist/swisseph-browser.js _site/swiss/swisseph-browser.js
          cp /tmp/swisseph-browser/package/dist/swisseph.js _site/swiss/swisseph.js
          cp /tmp/swisseph-browser/package/dist/swisseph.wasm _site/swiss/swisseph.wasm

          SWISS_COMMIT='9083a12d59e98034fb2337061481ac8800c16e64'
          for f in sepl_18.se1 semo_18.se1 seas_18.se1; do
            curl --fail --location --retry 4               "https://raw.githubusercontent.com/aloistr/swisseph/${SWISS_COMMIT}/ephe/${f}"               -o "_site/swiss/ephe/${f}"
          done

          test "$(stat -c%s _site/swiss/swisseph.wasm)" -gt 100000
          test "$(stat -c%s _site/swiss/ephe/sepl_18.se1)" -gt 100000
          test "$(stat -c%s _site/swiss/ephe/semo_18.se1)" -gt 500000
          test "$(stat -c%s _site/swiss/ephe/seas_18.se1)" -gt 100000
          python .site-src/asset-provenance.py

          # Build the lightweight TypeScript/Vite entry only after the complete legacy app exists.
          npm run build
          cp -R _shell/. _site/
          test "$(stat -c%s _site/index.html)" -lt 500000

          python - <<'PY'
          from pathlib import Path
          wasm = Path('_site/swiss/swisseph.wasm')
          magic = wasm.read_bytes()[:4]
          if magic != bytes([0, 97, 115, 109]):
              raise SystemExit(f'Invalid WASM magic: {magic!r}')
          app = Path('_site/app.html').read_text('utf-8')
          shell = Path('_site/index.html').read_text('utf-8')
          required = [
              './swiss/swisseph-browser.js',
              './swiss/ephe/sepl_18.se1',
              './swiss/ephe/semo_18.se1',
              './swiss/ephe/seas_18.se1',
              './traditional-engine.js',
              './atlas-resume.js',
              './research-core.js',
              './research-lab.js',
              './research-analysis.js',
              './research-pdf.js',
              './research-vault.js',
              './research-vault-ui.js',
              './timeline-core.js',
              './timeline-ui.js',
              './guided-study.js',
              './offline-client.js',
              './swiss-scan-ui.js',
              './manifest.webmanifest',
          ]
          missing = [x for x in required if x not in app]
          if missing:
              raise SystemExit(f'Missing local runtime references in app.html: {missing}')
          if './app.html' not in shell:
              raise SystemExit('Vite shell does not lazy-load app.html')
          if Path('_site/index.html').stat().st_size >= 500000:
              raise SystemExit('Initial Vite shell exceeds 500 KB')
          for name in ('service-worker.js','ephemeris-provenance.json','manifest.webmanifest','offline-client.js','app-icon.svg','swiss-scan-worker.js'):
              if not (Path('_site')/name).is_file():
                  raise SystemExit('Missing published offline/provenance asset: '+name)
          if './service-worker.js' not in Path('_site/offline-client.js').read_text('utf-8'):
              raise SystemExit('Offline client did not register the worker')
          if './ephemeris-provenance.json' not in Path('_site/research-lab.js').read_text('utf-8'):
              raise SystemExit('Natal provenance does not use the released asset manifest')
          if 'Técnicas tradicionais Pro' not in app:
              raise SystemExit('Traditional Pro suite was not assembled')
          print('Static site, Swiss Ephemeris assets and Traditional Pro suite validated.')
          PY
          python .site-src/build-metrics.py
          python .site-src/integration-contracts.test.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
