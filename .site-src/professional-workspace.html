<style>
#oa-pro-workspace{display:block;position:fixed;right:14px;bottom:14px;z-index:2147483641;font:14px/1.5 system-ui;color:#eefaff}#oa-pw-toggle,#oa-pw-panel button{border:1px solid #79d2d0;background:#123e5a;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}#oa-pw-panel{width:min(700px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;padding:18px;background:#071c2d;border:1px solid #79d2d0;border-radius:14px;box-shadow:0 24px 70px #000b}#oa-pw-panel h2,#oa-pw-panel h3{color:#ffdc83}#oa-pw-panel output{display:block;white-space:pre-wrap;background:#04131f;padding:12px;border-radius:9px;overflow-wrap:anywhere}.oa-pw-actions,.oa-pw-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.oa-pw-grid label{display:grid;gap:3px;min-width:130px}.oa-pw-grid select,.oa-pw-grid input{max-width:180px;padding:7px;background:#fff;color:#10243a}#oa-pw-panel button:focus-visible,#oa-pw-panel input:focus-visible,#oa-pw-panel select:focus-visible{outline:3px solid #ffdc83}@media(max-width:650px){#oa-pro-workspace{bottom:180px}.oa-pw-grid label{width:100%}}
</style>
<section id="oa-pro-workspace" aria-label="Leitura e agenda profissional">
 <button id="oa-pw-toggle" type="button" aria-expanded="false" aria-controls="oa-pw-panel">Leitura &amp; agenda</button>
 <div id="oa-pw-panel" hidden><div class="oa-pw-actions"><h2>Workspace natal e temporal</h2><button id="oa-pw-close" type="button">Fechar</button></div>
 <p>Mesmos cálculos, três profundidades e rastreabilidade. Ciclos são hipóteses simbólicas, não garantias de acontecimentos.</p>
 <div class="oa-pw-actions"><button id="oa-pw-essential" type="button">Essencial</button><button id="oa-pw-intermediate" type="button">Intermediário</button><button id="oa-pw-professional" type="button">Profissional</button></div>
 <div class="oa-pw-actions"><button id="oa-pw-natal" type="button">Gerar leitura natal</button><button id="oa-pw-json" type="button">Exportar JSON</button><button id="oa-pw-svg" type="button">Exportar SVG</button><button id="oa-pw-pdf" type="button">Exportar PDF</button></div>
 <h3>Agenda configurável</h3><div class="oa-pw-grid">
  <label>Corpo em movimento<select id="oa-pw-body"><option value="0">Sol</option><option value="1">Lua</option><option value="2">Mercúrio</option><option value="3">Vênus</option><option value="4">Marte</option><option value="5">Júpiter</option><option value="6">Saturno</option><option value="7">Urano</option><option value="8">Netuno</option><option value="9">Plutão</option></select></label>
  <label>Alvo natal<select id="oa-pw-target"><option value="0">Sol</option><option value="1">Lua</option><option value="2">Mercúrio</option><option value="3">Vênus</option><option value="4">Marte</option><option value="5">Júpiter</option><option value="6">Saturno</option><option value="10">Ascendente</option></select></label>
  <label>Período em dias<input id="oa-pw-days" type="number" min="1" max="365" value="30"></label><label>Orbe<input id="oa-pw-orb" type="number" min="0.1" max="6" step="0.1" value="1"></label>
 </div><fieldset><legend>Técnicas</legend><label><input id="oa-pw-transit" type="checkbox" checked> Trânsitos</label> <label><input id="oa-pw-progression" type="checkbox"> Progressão secundária</label> <label><input id="oa-pw-direction" type="checkbox"> Arco solar verdadeiro</label> <label><input id="oa-pw-return" type="checkbox"> Retorno planetário</label></fieldset>
 <div class="oa-pw-actions"><button id="oa-pw-forecast" type="button">Calcular agenda</button><button id="oa-pw-ics" type="button">Exportar agenda ICS</button><button id="oa-pw-notify" type="button">Ativar lembretes locais</button></div>
 <h3>Dados locais e privacidade</h3><div class="oa-pw-actions"><button id="oa-pw-backup" type="button">Backup local completo</button><label>Restaurar backup <input id="oa-pw-restore" type="file" accept="application/json"></label><button id="oa-pw-erase" type="button">Apagar dados locais do Observatório</button></div>
 <output id="oa-pw-output" aria-live="polite">Calcule um mapa para começar.</output></div>
</section>
<script src="./forecast-core.js"></script><script src="./portable-backup.js"></script><script src="./quality-gates.js"></script><script src="./professional-workspace.js"></script><script src="./privacy-controls.js"></script>
